name: gc-debug
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          B=https://jaehakang.goatcounter.com/api/v0
          for p in "me" "stats/total" "stats/hits" "stats/hits?limit=100" "stats/hits?start=2026-10-21T00:00:00Z" "stats/hits?start=2026-10-21T00:00:00Z&end=2026-10-22T09:00:00Z&limit=100" "stats/hits?start=2026-10-21T00:00:00Z&end=2026-10-22T11:00:00Z&limit=100" "paths"; do
            echo "== $p"; curl -s -w ' [%{http_code}]' -H "Authorization: Bearer $T" -H 'Content-Type: application/json' "$B/$p" | head -c 400; echo
          done

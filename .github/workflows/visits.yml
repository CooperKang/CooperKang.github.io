name: Update visit counts

on:
  schedule:
    - cron: '7 * * * *' # 매시 7분
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/visits.mjs
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      - name: Commit if changed
        run: |
          git add data/visits.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "방문 수 갱신"
          git pull --rebase origin main
          git push

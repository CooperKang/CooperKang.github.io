<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JaeHa Kang 서비스</title>
    <meta name="description" content="JaeHa Kang이 직접 만들어 운영하는 서비스 모음" />
    <meta property="og:title" content="JaeHa Kang 서비스" />
    <meta property="og:description" content="직접 만들어 운영하는 서비스 모음" />
    <meta property="og:url" content="https://cooperkang.github.io/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231a1d24%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EJK%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Hahmlet:wght@800&family=Michroma&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --ink: #1a1d24;
        --muted: #646b78;
        --line: #dfe2e8;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #13151a;
          --surface: #1c1f26;
          --ink: #eceef2;
          --muted: #9aa1ad;
          --line: #2c303a;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 20px;
      }
      header {
        padding: 72px 0 40px;
      }
      header h1 {
        margin: 0;
        font-size: clamp(36px, 7vw, 64px);
        line-height: 1.1;
        letter-spacing: -0.02em;
        font-weight: 800;
      }
      header p {
        margin: 16px 0 0;
        max-width: 34em;
        font-size: 18px;
        line-height: 1.6;
        color: var(--muted);
      }
      .count {
        margin: 0 0 14px;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      ul.services {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 20px;
      }
      .service {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        align-items: stretch;
        text-decoration: none;
        background: var(--surface);
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid var(--line);
        transition:
          transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.25s;
      }
      .service:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 50px -28px rgb(0 0 0 / 0.35);
      }
      .service:active {
        transform: translateY(-1px) scale(0.995);
      }
      .info {
        padding: 32px;
        display: flex;
        flex-direction: column;
      }
      .name {
        margin: 0;
        font-size: 40px;
        line-height: 1.15;
        color: var(--accent);
      }
      .tagline {
        margin: 12px 0 0;
        font-size: 17px;
        line-height: 1.6;
        color: var(--muted);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
      }
      .tags li {
        font-size: 13px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--bg);
        color: var(--muted);
      }
      .open {
        margin-top: auto;
        padding-top: 28px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 16px;
      }
      .open span {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 14px;
        background: var(--ink);
        color: var(--surface);
      }
      .open small {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }
      .shot {
        position: relative;
        background: var(--accent-soft);
        min-height: 260px;
      }
      .shot img {
        position: absolute;
        inset: 28px 0 0 28px;
        width: calc(100% - 28px);
        height: calc(100% - 28px);
        object-fit: cover;
        object-position: right top;
        border-top-left-radius: 14px;
        box-shadow: 0 10px 30px -12px rgb(0 0 0 / 0.3);
      }
      .next {
        margin-top: 20px;
        padding: 22px 28px;
        border: 2px dashed var(--line);
        border-radius: 28px;
        color: var(--muted);
        font-size: 15px;
      }
      footer {
        padding: 56px 0 48px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        font-size: 14px;
        color: var(--muted);
      }
      footer a {
        text-underline-offset: 3px;
      }
      @media (max-width: 720px) {
        header {
          padding: 48px 0 28px;
        }
        .service {
          grid-template-columns: 1fr;
        }
        .info {
          padding: 24px;
        }
        .name {
          font-size: 32px;
        }
        .shot {
          min-height: 220px;
          order: -1;
        }
        .shot img {
          inset: 20px 0 0 20px;
          width: calc(100% - 20px);
          height: calc(100% - 20px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .service {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>JaeHa Kang 서비스</h1>
        <p>생활하다 필요해진 것들을 직접 만들어 운영해요. 원하는 서비스를 눌러 바로 써 보세요.</p>
      </header>

      <main>
        <p class="count" id="count"></p>
        <ul class="services" id="services"></ul>
        <p class="next">다음 서비스를 만들고 있어요. 새 서비스가 나오면 여기에 추가돼요.</p>
      </main>

      <footer>
        <span>만든 사람 <a href="https://github.com/CooperKang">JaeHa Kang</a></span>
        <a href="https://github.com/CooperKang">GitHub @CooperKang</a>
      </footer>
    </div>

    <script>
      // 새 서비스는 이 목록에 추가한다. url은 같은 사이트 경로(/저장소이름/)나 전체 주소 모두 된다.
      const SERVICES = [
        {
          name: '우리 호칭',
          url: '/family-tree/',
          tagline: '양가 가족을 등록하면 한 장의 가계도로 이어 주고, 누구 입장에서든 모두를 뭐라고 부르는지 알려줘요.',
          tags: ['결혼', '가족 호칭', '로그인 없음'],
          image: 'images/services/family-tree.png',
          imageAlt: '우리 호칭 가계도에서 아내의 여동생을 눌러 처제라고 나온 화면',
          source: 'https://github.com/CooperKang/family-tree',
          font: "'Gowun Batang', serif",
          accent: '#c0394b',
          accentSoft: '#e3e9f6',
        },
        {
          name: '스쿼시 코트',
          url: '/squash/',
          tagline: '스쿼시 규칙과 장비를 익히고, 내 스타일에 맞는 라켓을 찾고, 국내외 대회 현황을 보고, 터치로 치는 미니 게임까지.',
          tags: ['스쿼시 입문', '라켓 추천', '대회 현황판', '미니 게임'],
          image: 'images/services/squash.png',
          imageAlt: '스쿼시 코트 첫 화면: 실버와 청록색 라켓 그림과 메뉴 카드',
          source: 'https://github.com/CooperKang/squash',
          font: "'Michroma', sans-serif",
          accent: '#00707d',
          accentSoft: '#d4ebed',
        },
        {
          name: '첫 집 계산기',
          url: '/first-home/',
          tagline: '내 소득과 모은 돈으로 얼마짜리 집까지 될까? LTV·스트레스 DSR·장래소득·정책 대출부터 취득세와 중도금 이자까지, 첫 집이라 놓치기 쉬운 것을 통장처럼 정리해 줘요.',
          tags: ['사회초년생', '생애최초', '신혼부부', '대출 한도', '미래 계산기'],
          image: 'images/services/first-home.png',
          imageAlt: '첫 집 계산기 첫 화면: 초록 통장 표지 아래 살 수 있는 집값과 계산 완료 도장',
          source: 'https://github.com/CooperKang/first-home',
          font: "'Hahmlet', serif",
          accent: '#1f6f5c',
          accentSoft: '#dcebe5',
        },
      ]

      const list = document.getElementById('services')
      document.getElementById('count').textContent = `서비스 ${SERVICES.length}개`
      for (const s of SERVICES) {
        const li = document.createElement('li')
        const a = document.createElement('a')
        a.className = 'service'
        a.href = s.url
        a.style.setProperty('--accent', s.accent)
        a.style.setProperty('--accent-soft', s.accentSoft)

        const info = document.createElement('div')
        info.className = 'info'
        const h = document.createElement('h2')
        h.className = 'name'
        h.style.fontFamily = s.font
        h.textContent = s.name
        const p = document.createElement('p')
        p.className = 'tagline'
        p.textContent = s.tagline
        const tags = document.createElement('ul')
        tags.className = 'tags'
        tags.setAttribute('aria-label', '특징')
        for (const t of s.tags) {
          const tag = document.createElement('li')
          tag.textContent = t
          tags.append(tag)
        }
        const open = document.createElement('p')
        open.className = 'open'
        const btn = document.createElement('span')
        btn.textContent = `${s.name} 열기`
        const host = document.createElement('small')
        host.textContent = new URL(s.url, location.href).host + new URL(s.url, location.href).pathname
        open.append(btn, host)
        info.append(h, p, tags, open)

        const shot = document.createElement('div')
        shot.className = 'shot'
        const img = document.createElement('img')
        img.src = s.image
        img.alt = s.imageAlt
        img.loading = 'lazy'
        shot.append(img)

        a.append(info, shot)
        li.append(a)
        list.append(li)
      }
    </script>
  </body>
</html>
